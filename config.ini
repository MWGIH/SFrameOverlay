[overlay]
# Position relative to your head, in metres. Negative x = left, positive y = up.
offset_x = -0.30
offset_y = 0.20
# How far in front of your eyes the panel floats.
distance = 1.0
# Panel width in metres (height scales with it).
width_m = 0.24
# Background opacity, 0 (transparent) to 255 (solid black).
background_alpha = 190
